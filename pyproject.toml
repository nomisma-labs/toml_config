[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nomisma-toml-config"
dynamic = ["version"]
description = "tcfg layered application configuration and TOML generator"
requires-python = ">=3.11"
license = "LicenseRef-Nomisma-Labs-Proprietary"
license-files = ["LICENSE"]

[project.scripts]
tcfg = "toml_config.__main__:main"

[tool.setuptools.packages.find]
where = ["python"]
